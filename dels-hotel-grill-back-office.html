<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>Del's Hotel Grill &amp; Restaurant, Back Office</title>
<style>
:root{
  --ink:#f6f1ea;--mute:#b9ada3;--faint:#8f847b;
  --accent:#ff8a3d;--accent-2:#e8512a;--brass:#ffb86b;--teal:#3dd9c0;
  --glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --ok:#7fe0b0;--warn:#ffcb7a;--bad:#ff8f8f;
  --glow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
  --ease:cubic-bezier(.22,.61,.36,1);
  --sans:"Inter","SF Pro Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:linear-gradient(155deg,#0a0d12 0%,#15121a 35%,#241510 70%,#35190d 100%) fixed;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{width:60vmax;height:60vmax;top:-25vmax;right:-18vmax;background:radial-gradient(circle,rgba(255,122,47,.55),transparent 68%);opacity:.7}
body::after{width:55vmax;height:55vmax;bottom:-25vmax;left:-18vmax;background:radial-gradient(circle,rgba(45,212,191,.4),transparent 68%);opacity:.6}
h1,h2,h3{margin:0;font-weight:600}
h1,h2{font-family:var(--serif);letter-spacing:-.01em}
h2{font-size:30px;line-height:1.15}
p{margin:6px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* brand */
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:18px;line-height:1.15}
.brand span{color:var(--mute);font-size:13px}
.logo{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,#ffb86b,#ff7a2f 55%,#e8512a);
  box-shadow:0 8px 24px rgba(255,122,47,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.logo svg{width:22px;height:22px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:min(410px,100%);display:grid;gap:14px;padding:34px;border-radius:26px;
  background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)}
.lcard .brand{margin-bottom:6px}
.lcard .brand h1{font-size:24px}

/* shell */
#app{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;padding:22px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
  border-right:1px solid var(--line)}
aside .brand{padding:0 8px 6px}
#nav{display:flex;flex-direction:column;gap:2px}
.ng{font-size:12px;font-weight:600;color:var(--faint);padding:14px 12px 4px;letter-spacing:.02em}
.nv{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--mute);text-align:left;padding:9px 12px;border-radius:11px;font:inherit;font-size:14.5px;cursor:pointer;
  transition:background .25s var(--ease),color .25s var(--ease)}
.nv svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nv:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.nv.on{color:#fff;font-weight:600;background:linear-gradient(90deg,rgba(255,138,61,.26),rgba(255,138,61,.05));box-shadow:inset 2px 0 0 var(--accent)}
.nv.on svg{color:var(--brass);opacity:1}
aside>.btn{margin-top:auto}
main{flex:1;min-width:0;padding:30px 36px}
header.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.printhead{display:none}

/* surfaces */
.card{position:relative;min-width:0;padding:20px;border-radius:18px;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
  border:1px solid var(--line);box-shadow:var(--glow);transition:border-color .3s var(--ease)}
.card:hover{border-color:rgba(255,255,255,.26)}
.card h3{font-size:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi span{color:var(--mute);font-size:13px}
.kpi strong{display:block;font-size:27px;font-weight:650;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mute)}
.kpis>.kpi:first-child{background:linear-gradient(150deg,rgba(255,138,61,.30),rgba(232,81,42,.07));border-color:rgba(255,138,61,.45)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:16px}
.two>.card{margin-top:0}
.card+.card,.card+.two,.two+.card,.kpis+.two{margin-top:16px}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}

/* chart */
.chart{display:flex;gap:14px;height:220px;padding-top:12px;
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),rgba(255,255,255,.08) calc(25% - 1px),rgba(255,255,255,.08) 25%)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:0}
.bars{flex:1;width:100%;min-height:0;display:flex;gap:4px;align-items:flex-end;justify-content:center}
.bars i{display:block;width:40%;max-width:24px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#ffb86b,#ff7a2f)}
.bars i.e{background:linear-gradient(180deg,#5eead4,#14b8a6)}
.col small{color:var(--mute)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:#ff8a3d;margin:0 6px 0 12px}
.sw.e{background:#2dd4bf}
.muted{color:var(--mute);font-size:14px;margin:8px 0 0}

/* forms and buttons */
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
input,select{min-width:0;padding:9px 12px;border-radius:12px;font:inherit;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:background .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease)}
input::placeholder{color:#857a72}
input:focus,select:focus{outline:none;background:rgba(255,255,255,.10);border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,138,61,.22)}
select option{background:#1b1620;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.stack{display:grid;gap:12px}
.btn{justify-self:start;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;color:#1b0f06;font-family:inherit;font-weight:650;font-size:14px;
  background:linear-gradient(135deg,#ffb86b,#ff7a2f 55%,#f0582c);
  box-shadow:0 8px 22px rgba(255,122,47,.32),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 12px 28px rgba(255,122,47,.42),inset 0 1px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.mini{padding:5px 11px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap;color:var(--ink);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
  transition:background .2s var(--ease),transform .2s var(--ease)}
.mini:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.hrs{width:90px}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:11px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid rgba(255,255,255,.07)}
th{color:var(--mute);font-weight:600;font-size:13px;border-bottom:1px solid rgba(255,255,255,.2)}
tbody tr{transition:background .2s var(--ease)}
tbody tr:hover{background:rgba(255,255,255,.05)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.1);color:var(--mute)}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.ok{background:rgba(127,224,176,.14);color:var(--ok)}
.b.warn{background:rgba(255,203,122,.14);color:var(--warn)}
.b.bad{background:rgba(255,143,143,.14);color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.head h3{margin:0}
details{margin-top:10px;padding:2px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
summary{cursor:pointer;padding:11px 0;font-weight:600}

/* people */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.pcard h3{font-size:17px;margin-bottom:4px}
.pcard p{margin:4px 0}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:12px;color:#1b0f06;font-weight:700;
  background:linear-gradient(135deg,#ffb86b,#ff7a2f 60%,#e8512a);box-shadow:0 6px 16px rgba(255,122,47,.35)}
dl{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;margin:14px 0 0}
dt{color:var(--mute)}
dd{margin:0}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:9;
  background:rgba(22,17,20,.85);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border:1px solid rgba(255,138,61,.55);box-shadow:var(--glow);padding:11px 20px;border-radius:14px;
  transition:opacity .35s var(--ease),transform .35s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  #app{flex-direction:column}
  aside{width:auto;height:auto;position:static;overflow:visible;padding:14px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  #nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .ng{display:none}
  .nv{white-space:nowrap;flex-shrink:0}
  aside>.btn{margin-top:0}
  main{padding:20px 16px}
  h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:none!important;animation:none!important}
  html,body{background:#fff!important;color:#000}
  body::before,body::after,aside,.tools,.btn,.mini,form,.quick,#toast,#login{display:none!important}
  #app{display:block}
  main{padding:0}
  .printhead{display:flex!important;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px;font-size:13px}
  .printhead strong{font-family:var(--serif);font-size:18px}
  header.top{margin-bottom:12px}
  .card{background:#fff!important;border:1px solid #bbb!important;border-radius:6px;break-inside:avoid;color:#000;margin-top:12px!important}
  .kpi span,.muted,th{color:#444!important}
  h2,h3,.kpi strong{color:#000}
  table{min-width:0!important;font-size:11px}
  th,td{border-bottom:1px solid #ccc!important;padding:5px 4px}
  .b{background:none!important;color:#000!important;border:1px solid #888}
  .b::before{display:none}
  details{border-color:#bbb;background:#fff}
  .scroll{overflow:visible}
  .two{display:block}
  .two>.card{margin-bottom:12px}
}
.mark{display:block;max-width:100%;height:auto}
.login-mark{width:190px;margin:0 auto}
.side-mark{width:160px;margin:2px auto 0}
.welcome{display:flex;align-items:center;gap:22px;margin-bottom:16px}
.welcome .mark{width:104px;flex-shrink:0}
.welcome h3{font-family:var(--serif);font-size:22px;margin:0}
#doc{display:none}
.dh{display:flex;align-items:center;gap:16px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}.dh img{width:90px}
@media print{body.pdoc #app,body.pdoc #toast{display:none!important}body.pdoc #doc{display:block;color:#000;font-size:13px}#doc table{min-width:0;font-size:12px}#doc th,#doc td{border-bottom:1px solid #ccc!important;color:#000!important}#doc h2{color:#000;margin:8px 0}.printhead{align-items:center;gap:12px}.printhead strong{flex:1}}
.av.ph{object-fit:cover}.av.lg{width:92px;height:92px;font-size:28px;margin:0}
.phead{display:flex;align-items:center;gap:18px;margin-bottom:14px}
input[type=file]{padding:7px 10px}
input[type=checkbox]{justify-self:start;width:18px;height:18px;padding:0}
dl{grid-template-columns:150px 1fr}

/* animated stars */
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#login,#app{position:relative;z-index:1}
.mark{filter:drop-shadow(0 0 14px rgba(255,200,90,.35))}
@media print{#stars{display:none!important}}

#bd{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(180deg,rgba(8,6,12,.35),rgba(8,6,12,.72)),var(--wall) center 30%/cover no-repeat}
body:has(#app[hidden]) #bd{opacity:1}
aside{background:linear-gradient(180deg,rgba(10,8,14,.72),rgba(10,8,14,.88)),var(--wall) 38% center/cover no-repeat!important}
@media print{#bd{display:none!important}}
#sync{font-size:12px;margin-left:10px;padding:2px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.22);white-space:nowrap}
#sync::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#5fd38d}
#sync[data-s=saving]::before{background:#ffd98a;animation:pls 1s infinite}
#sync[data-s=offline]::before{background:#ff6b6b}
@keyframes pls{50%{opacity:.3}}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.rm{padding:10px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:inherit;cursor:pointer;font:inherit;font-weight:700}
.rm small{display:block;font-size:10px;font-weight:500;opacity:.85}
.rm-Dirty{background:rgba(255,143,143,.22)}.rm-Cleaning{background:rgba(255,203,122,.22)}.rm-Clean{background:rgba(127,224,176,.18)}.rm-Inspected{background:rgba(127,200,255,.22)}.rm-Occupied{background:rgba(190,150,255,.22)}.rm-Outoforder{background:rgba(120,120,120,.35)}
</style>
</head>
<body>

<section id="login">
  <form class="lcard" onsubmit="login(event)">
    <img class="mark login-mark" data-logo alt="Del's Hotel, Grill and Restaurant">
    <p class="muted" style="text-align:center" id="lsub">Back office sign in</p>
    <label>Email<input name="u" type="email" autocomplete="username" required></label>
    <label>Password<input name="p" type="password" autocomplete="current-password" minlength="8" required></label>
    <p id="err" role="alert" style="color:var(--bad);min-height:20px"></p>
    <button class="btn" id="goBtn">Sign in</button>
    <button type="button" class="mini" id="modeBtn" onclick="setMode()" style="margin:12px auto 0;display:block">First time? Create account</button>
  </form>
</section>

<div id="app" hidden>
  <aside>
    <img class="mark side-mark" data-logo alt="Del's Hotel, Grill and Restaurant">
    <nav id="nav"></nav>
    <button class="btn ghost" onclick="logout()">Sign out</button>
  </aside>
  <main>
    <div class="printhead"><img class="mark" data-logo style="width:64px" alt=""><strong id="pname"></strong><span id="pdate"></span></div>
    <header class="top"><div><h2 id="title"></h2><span id="who" class="muted"></span><span id="sync" data-s="ok"></span></div></header>
    <section id="view"></section>
  </main>
</div>

<div id="toast" role="status"></div>
<div id="doc"></div>

}
function sumType(t){return Object.keys(ACCTS).filter(c=>ACCTS[c][1]===t).reduce((a,c)=>a+bal(c),0)}

const r2=x=>Math.round(x*100)/100;
function calc(e){
  const st=S.settings,h=+e.hours||0,ot=Math.max(h-st.regHours,0),basic=r2((h-ot)*e.rate),g=r2(basic+ot*e.rate*st.otRate);
  const msc=Math.min(35000,Math.max(5000,Math.round(g/500)*500));
  const sss=g?r2(msc*.05):0, sssEr=g?r2(msc*.10+(msc<15000?10:30)):0;
  const ph=g?r2(Math.min(100000,Math.max(10000,basic))*.025):0, hd=g?r2(Math.min(g,10000)*.02):0;
  const ti=Math.max(0,g-sss-ph-hd);
  const br=[[666667,183541.8,.35],[166667,33541.8,.30],[66667,8541.8,.25],[33333,1875,.20],[20833,0,.15]].find(b=>ti>=b[0]);
  const wt=br?r2(br[1]+(ti-br[0])*br[2]):0;
  const adv=S.adv.filter(a=>a.emp===e.id&&a.status==='Approved'&&a.balance>0);
  const owed=adv.reduce((a,x)=>a+x.balance,0);
  const rec=r2(Math.min(owed,Math.max(0,g-sss-ph-hd-wt)*.2));
  return {ot,basic,gross:g,sss,ph,hd,wt,tax:wt,er:r2(sssEr+ph+hd),rec,net:r2(g-sss-ph-hd-wt-rec),adv};
}

  let photo;try{photo=file?await readPhoto(file):undefined}catch(x){return toast('That image could not be read. Use a JPG or PNG.')}
  const d={name:g('name'),role:g('role'),dept:g('dept'),type:g('type'),rate:+g('rate')||0,hired:g('hired')||TODAY,dob:g('dob'),phone:g('phone'),email:g('email'),address:g('address'),ecName:g('ecName'),ecPhone:g('ecPhone'),tin:g('tin'),sss:g('sss'),phic:g('phic'),hdmf:g('hdmf'),notes:g('notes')};
  if(!d.name||!d.role||!d.dept)return toast('Enter a name, job title and department.');
  if(id){const e=S.emp.find(x=>x.id===id);Object.assign(e,d);if(photo!==undefined)e.photo=photo;if(f.elements.rmphoto&&f.elements.rmphoto.checked)e.photo='';editEmp=false;toast('Profile saved')}

  render();
}

function vRep(){
  const line=c=>`<tr><td>${c}</td><td>${esc(ACCTS[c][0])}</td><td class="num">${fm(bal(c))}</td></tr>`;

  const assets=Object.keys(ACCTS).filter(c=>ACCTS[c][1]==='asset'), liabs=Object.keys(ACCTS).filter(c=>ACCTS[c][1]==='liability'), eqs=Object.keys(ACCTS).filter(c=>ACCTS[c][1]==='equity');
  const tr=sumType('revenue'), te=sumType('expense'), ni=tr-te;
  const ta=assets.reduce((a,c)=>a+bal(c),0), tl=liabs.reduce((a,c)=>a+bal(c),0), teq=eqs.reduce((a,c)=>a+bal(c),0)+ni;

function moveStock(idx,type,q,note){
  const i=S.inv[idx];
  if(!i||!(q>0))return toast('Enter a quantity above zero.');
  if(type==='Issue'&&q>i.qty)return toast(`Only ${i.qty} units of ${i.name} in stock.`);
  const sign=type==='Receive'?1:-1, v=q*i.cost;
  i.qty+=sign*q;
  S.mov.unshift({date:TODAY,sku:i.sku,item:i.name,type,qty:sign*q,value:v,note:note||type});
  const memo=`${type} ${i.sku}${note?', '+note:''}`;
  if(sign>0)S.gl.push({date:TODAY,memo,acct:'1200',dr:v,cr:0},{date:TODAY,memo,acct:'1000',dr:0,cr:v});
  else S.gl.push({date:TODAY,memo,acct:'6100',dr:v,cr:0},{date:TODAY,memo,acct:'1200',dr:0,cr:v});
  toast(`${type} recorded`);
}

function download(name,type,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csvCell(c){
  const inp=c.querySelector('input');
  if(inp)return inp.type==='checkbox'?(inp.checked?'Yes':'No'):inp.value;
  const k=c.cloneNode(true);k.querySelectorAll('button').forEach(b=>b.remove());
  return k.textContent.replace(/\s+/g,' ').trim();
}
function exportCSV(){
  const tables=[...document.querySelectorAll('#view table')];
  if(!tables.length)return toast('Nothing to export on this page.');
  const q=s=>/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  const out=tables.map(t=>[...t.rows].map(r=>[...r.cells].map(c=>q(csvCell(c))).join(',')).join('\n')).join('\n\n');
  download(`dels-hotel-grill-${cur}-${TODAY}.csv`,'text/csv;charset=utf-8','\uFEFF'+out);
  toast('CSV downloaded');
}

function folioBal(f){return f.charges.reduce((a,c)=>a+c.amt,0)-f.payments.reduce((a,p)=>a+p.amt,0)}
function folioState(f){
  const b=folioBal(f);
  if(b<=0.005)return 'Paid';
  if(f.due<TODAY)return 'Overdue';
  return f.payments.length?'Partly paid':'Open';
}

function restoreBackup(el){
  const file=el.files[0];
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.emp||!d.gl||!d.inv)throw new Error('not a backup');
      S=Object.assign(EMPTY(),d);delete S.auth;delete S.lock;
      toast('Backup restored');
      render();
    }catch(e){toast('That file is not a valid backup.')}
  };
  r.readAsText(file);
  el.value='';
}
function resetData(){
  if(confirm('Erase ALL data in your cloud account, on every device? This cannot be undone. Download a backup first if unsure.')){
    S=EMPTY();delete S.auth;delete S.lock;cur='dash';render();toast('All data erased');
  }
}

function payBill(n){
  const b=S.bills[n];
  if(!b||b.paid)return;
  b.paid=true;b.paidOn=TODAY;
  const memo=`Payment, bill ${b.no}, ${b.vendor}`;
  S.gl.push({date:TODAY,memo,acct:'2100',dr:b.amt,cr:0},{date:TODAY,memo,acct:'1000',dr:0,cr:b.amt});
  toast('Bill paid from cash');
  render();
}

function vRec(){
  const cash=S.gl.map((l,i)=>({l,i})).filter(x=>x.l.acct==='1000');
  const book=cash.reduce((a,x)=>a+x.l.dr-x.l.cr,0);
  const cleared=cash.filter(x=>x.l.cl).reduce((a,x)=>a+x.l.dr-x.l.cr,0);
  const has=S.stmt!=null, diff=has?S.stmt-cleared:0;

function runPayroll(){
  const active=S.emp.filter(e=>e.status==='Active');
  if(!active.length)return toast('No active employees to pay.');
  if(S.runs.some(r=>r.date.slice(0,7)===TODAY.slice(0,7))&&!confirm('Payroll was already run this month. Run it again?'))return;
  let g=0,w=0,c=0,er=0,r=0,n=0;const lines=[];
  active.forEach(e=>{
    const x=calc(e);g+=x.gross;w+=x.wt;c+=x.sss+x.ph+x.hd+x.er;er+=x.er;r+=x.rec;n+=x.net;
    let left=x.rec;x.adv.forEach(a=>{const t=Math.min(a.balance,left);a.balance=r2(a.balance-t);left-=t;if(a.balance<=0)a.status='Repaid'});
    lines.push({id:e.id,name:e.name,basic:x.basic,gross:x.gross,net:x.net});e.hours=0;
  });
  S.gl.push({date:TODAY,memo:'Payroll run',acct:'6000',dr:r2(g),cr:0},{date:TODAY,memo:'Employer contributions',acct:'6050',dr:r2(er),cr:0},{date:TODAY,memo:'Net pay',acct:'1000',dr:0,cr:r2(n)},{date:TODAY,memo:'Withholding tax',acct:'2000',dr:0,cr:r2(w)},{date:TODAY,memo:'SSS, PhilHealth, Pag-IBIG payable',acct:'2300',dr:0,cr:r2(c)},{date:TODAY,memo:'Advance repayments',acct:'1300',dr:0,cr:r2(r)});
  S.runs.unshift({date:TODAY,count:active.length,gross:r2(g),wt:r2(w),con:r2(c),rec:r2(r),net:r2(n),lines});
  toast('Payroll posted and period closed');render();
}

/* ---------- Stock modules (F&B, Housekeeping) ---------- */
const STK={
  fnb:{col:'fnb',mov:'fmov',inv:'1210',pre:'FB-',short:'F&B',waste:'5200',cats:['Food','Beverage'],types:['Receive','Use','Waste','Count adjust'],units:['kg','g','L','mL','pcs','bottle','case','pack'],exp:(it,t)=>t==='Waste'?'5200':it.cat==='Beverage'?'5100':'5000'},
  hk:{col:'hk',mov:'hmov',inv:'1220',pre:'HK-',short:'Housekeeping',waste:'6200',cats:['Linens','Amenities','Cleaning','Laundry','Other'],types:['Receive','Issue to room','Damaged or lost','Count adjust'],units:['pcs','set','pack','bottle','L','box'],exp:(it,t)=>(it.cat==='Linens'||it.cat==='Laundry')?'6210':'6200'}
};
function applyMove(k,it,type,sq,uc,note,pay){
  const c=STK[k],q=Q(),v=r2(Math.abs(sq)*uc),memo=`${c.short} ${type}: ${it.name}${note?', '+note:''}`;
  it.qty=r2(it.qty+sq);
  q[c.mov].unshift({date:TODAY,sku:it.sku,item:it.name,type,qty:sq,value:v,note:note||''});
  if(v<=0)return;
  if(type==='Opening stock'){S.gl.push({date:TODAY,memo,acct:c.inv,dr:v,cr:0},{date:TODAY,memo,acct:'3000',dr:0,cr:v})}
  else if(type==='Receive'){
    const cr=pay==='credit'?'2100':'1000';
    S.gl.push({date:TODAY,memo,acct:c.inv,dr:v,cr:0},{date:TODAY,memo,acct:cr,dr:0,cr:v});
    if(pay==='credit'){S.bills=S.bills||[];S.bills.push({no:'B-'+(2001+S.bills.length),vendor:it.sup||'Supplier',desc:memo,amt:v,acct:c.inv,date:TODAY,due:addDays(TODAY,15),paid:false})}
  }else if(type==='Count adjust'){
    if(sq<0)S.gl.push({date:TODAY,memo,acct:c.waste,dr:v,cr:0},{date:TODAY,memo,acct:c.inv,dr:0,cr:v});
    else S.gl.push({date:TODAY,memo,acct:c.inv,dr:v,cr:0},{date:TODAY,memo,acct:c.waste,dr:0,cr:v});
  }else S.gl.push({date:TODAY,memo,acct:c.exp(it,type),dr:v,cr:0},{date:TODAY,memo,acct:c.inv,dr:0,cr:v});
}
function stStatus(i){const soon=addDays(TODAY,7);return i.qty<=0?['Out','bad']:(i.exp&&i.exp<TODAY)?['Expired','bad']:i.qty<=i.par?['Low','bad']:(i.exp&&i.exp<=soon)?['Expiring','warn']:['OK','ok']}

function aging(rows){
  const b=[0,0,0,0,0];rows.forEach(r=>{const d=dayDiff(r.due);b[d<=0?0:d<=30?1:d<=60?2:d<=90?3:4]+=r.amt});
  return tbl(['Name','Reference','Due','#Amount','#Days late'],rows.map(r=>`<tr>${td(esc(r.who))}${td(esc(r.ref))}${td(r.due)}${td(fm(r.amt),1)}${td(Math.max(dayDiff(r.due),0),1)}</tr>`),'Nothing outstanding.')+`<h3 style="margin-top:16px">Aging summary</h3>`+tbl(['#Current','#1-30 days','#31-60 days','#61-90 days','#Over 90'],[`<tr>${b.map(x=>td(fm(x),1)).join('')}</tr>`]);
}
function groupSum(pairs){const m={};pairs.forEach(([k,v])=>{m[k]=(m[k]||0)+v});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function rpBody(){

  if(type==='pl'){const r=sec('r',codesOf('revenue')),e=sec('e',codesOf('expense'));return tbl(['Code','Account','#Amount'],[...r.map(line),`<tr><th></th><th>Total income</th><th class="num">${fm(sum(r))}</th></tr>`,...e.map(line),`<tr><th></th><th>Total expenses</th><th class="num">${fm(sum(e))}</th></tr>`,`<tr><th></th><th>Net income</th><th class="num">${fm(sum(r)-sum(e))}</th></tr>`])}
  if(type==='bs'){const f2=(c)=>[c,net(c,'',to)],a=codesOf('asset').map(f2),l=codesOf('liability').map(f2),e=codesOf('equity').map(f2),ni=codesOf('revenue').reduce((s,c)=>s+net(c,'',to),0)-codesOf('expense').reduce((s,c)=>s+net(c,'',to),0);return tbl(['Code','Account','#Balance at '+to],[...a.map(line),`<tr><th></th><th>Total assets</th><th class="num">${fm(sum(a))}</th></tr>`,...l.map(line),`<tr><th></th><th>Total liabilities</th><th class="num">${fm(sum(l))}</th></tr>`,...e.map(line),`<tr><td></td><td>Net income to date</td><td class="num">${fm(ni)}</td></tr>`,`<tr><th></th><th>Total equity</th><th class="num">${fm(sum(e)+ni)}</th></tr>`])}
  if(type==='tb'){let D=0,C=0;const rows=Object.keys(ACCTS).map(c=>{const l=lines(c,'',to),d=l.reduce((a,x)=>a+x.dr,0),cr=l.reduce((a,x)=>a+x.cr,0);const n=d-cr;if(Math.abs(n)<.005)return '';const dd=n>0?n:0,cc=n<0?-n:0;D+=dd;C+=cc;return `<tr>${td(c)}${td(esc(ACCTS[c][0]))}${td(dd?fm(dd):'',1)}${td(cc?fm(cc):'',1)}</tr>`});return tbl(['Code','Account','#Debit','#Credit'],[...rows,`<tr><th></th><th>Totals ${Math.abs(D-C)<.005?'(balanced)':'(OUT OF BALANCE)'}</th><th class="num">${fm(D)}</th><th class="num">${fm(C)}</th></tr>`])}
  if(type==='gl'){let run=0;const t=ACCTS[acct]?ACCTS[acct][1]:'asset',sg=(t==='asset'||t==='expense')?1:-1;return tbl(['Date','Memo','#Debit','#Credit','#Balance'],lines(acct,from,to).sort((a,b)=>a.date<b.date?-1:1).map(l=>{run+=sg*(l.dr-l.cr);return `<tr>${td(l.date)}${td(esc(l.memo))}${td(l.dr?fm(l.dr):'',1)}${td(l.cr?fm(l.cr):'',1)}${td(fm(run),1)}</tr>`}),'No entries in this period.')}
  if(type==='ar'){const rows=[];Q().sales.filter(d=>d.posted&&!d.void&&d.type==='Invoice'&&d.total-d.paid>.005).forEach(d=>rows.push({who:d.cust,ref:d.no,due:d.due,amt:r2(d.total-d.paid)}));S.folios.forEach(f=>{const b=folioBal(f);if(b>.005)rows.push({who:f.guest,ref:f.no,due:f.due,amt:b})});return aging(rows)}
  if(type==='ap'){return aging((S.bills||[]).filter(b=>!b.paid).map(b=>({who:b.vendor,ref:b.no,due:b.due,amt:b.amt})))}
  if(type==='cf'){const m={};lines('1000',from,to).forEach(l=>{const k=l.date.slice(0,7);(m[k]=m[k]||{i:0,o:0});m[k].i+=l.dr;m[k].o+=l.cr});const open=net('1000','',addDays(from,-1));let run=open;return `<p class="muted">Cash at start of period: ${fm(open)}</p>`+tbl(['Month','#Cash in','#Cash out','#Net','#Cash at end'],Object.keys(m).sort().map(k=>{run+=m[k].i-m[k].o;return `<tr>${td(k)}${td(fm(m[k].i),1)}${td(fm(m[k].o),1)}${td(fm(m[k].i-m[k].o),1)}${td(fm(run),1)}</tr>`}),'No cash movement in this period.')}
  if(type==='sbc'){const p=[];Q().sales.filter(d=>d.posted&&!d.void&&d.date>=from&&d.date<=to).forEach(d=>p.push([d.cust,d.sub]));S.folios.forEach(f=>f.charges.filter(c=>c.date>=from&&c.date<=to).forEach(c=>p.push([f.guest,c.amt])));return tbl(['Customer','#Sales'],groupSum(p).map(([k,v])=>`<tr>${td(esc(k))}${td(fm(v),1)}</tr>`),'No sales in this period.')}
  if(type==='ebv'){const p=[];Q().exp.filter(e=>e.date>=from&&e.date<=to).forEach(e=>p.push([e.payee,e.amt-e.vat]));(S.bills||[]).filter(b=>b.date>=from&&b.date<=to&&!/^Expense|Housekeeping|F&B/.test(b.desc)).forEach(b=>p.push([b.vendor,b.amt]));return tbl(['Vendor or payee','#Spend'],groupSum(p).map(([k,v])=>`<tr>${td(esc(k))}${td(fm(v),1)}</tr>`),'No spending in this period.')}
  if(type==='fbc'){const rev=net('4100',from,to),f=net('5000',from,to),b=net('5100',from,to),w=net('5200',from,to),pc=x=>rev>0?Math.round(x/rev*100)+'%':'';return tbl(['Item','#Amount','#% of F&B sales'],[['Food and beverage sales',rev],['Cost of food',f],['Cost of beverages',b],['Waste and shrinkage',w],['Gross profit after F&B costs',rev-f-b-w]].map(([n,v])=>`<tr>${td(n)}${td(fm(v),1)}${td(pc(v),1)}</tr>`))}
  if(type==='stk'){const q=Q(),a=[['General inventory',S.inv.reduce((s,i)=>s+i.qty*i.cost,0),S.inv.length],['Food and beverage stock',q.fnb.reduce((s,i)=>s+i.qty*i.cost,0),q.fnb.length],['Housekeeping supplies',q.hk.reduce((s,i)=>s+i.qty*i.cost,0),q.hk.length]];return tbl(['Stock area','#Items','#Value'],[...a.map(x=>`<tr>${td(x[0])}${td(x[2],1)}${td(fm(x[1]),1)}</tr>`),`<tr><th>Total</th><th></th><th class="num">${fm(a.reduce((s,x)=>s+x[1],0))}</th></tr>`])}
  return '';
}

(function(){
  const bd=document.createElement('div');bd.id='bd';document.body.prepend(bd);const c=document.createElement('canvas');c.id='stars';c.setAttribute('aria-hidden','true');bd.after(c);
  const x=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
